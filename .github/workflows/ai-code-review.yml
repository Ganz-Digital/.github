name: AI consistency review
"on":
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Secrets are not available to fork PRs; skip drafts to save tokens
    if: "${{ github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft }}"
    runs-on: ubuntu-latest
    env:
      # pareto-code picks the cheapest available coding model above MIN_CODING_SCORE (0-1)
      MODEL: "openrouter/pareto-code"
      MIN_CODING_SCORE: "0.4"
      MAX_DIFF_CHARS: 200000
      GH_TOKEN: ${{ github.token }}
    # The review is advisory: steps may fail, but the job always succeeds so it never blocks a merge
    steps:
      - name: Checkout code
        id: checkout
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect diff
        id: diff
        continue-on-error: true
        run: |
          set -e
          git diff "origin/${{ github.base_ref }}...HEAD" -- . \
            ':!package-lock.json' ':!yarn.lock' ':!pnpm-lock.yaml' ':!*.snap' ':!**/dist/**' \
            > pr.diff
          if [ "$(wc -c < pr.diff)" -gt "$MAX_DIFF_CHARS" ]; then
            head -c "$MAX_DIFF_CHARS" pr.diff > pr.trimmed && mv pr.trimmed pr.diff
            printf '\n\n[diff truncated]\n' >> pr.diff
          fi

      - name: Run review
        id: review
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -e
          [ -s pr.diff ] || { echo "Empty diff, skipping"; exit 0; }

          MARKER="<!-- ai-consistency-review -->"

          # Find the most recent review comment so its findings can be re-checked
          gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$MARKER\")) | {node_id, body}" | jq -s '.' > previous.json || echo '[]' > previous.json
          jq -r 'last.body // empty' previous.json > previous.raw || true
          # Drop the marker and cost footer, keep the findings
          grep -v -e "^$MARKER" -e '^<sub>💰' previous.raw > previous.md || true

          PROMPT="Do a consistency check of this PR. Does it introduce code duplication? Does it use different names for the same things? Is it as simple as possible and reasonable? Does it create unnecessary boilerplate? Ignore translations."
          if [ -s previous.md ]; then
            PROMPT="$PROMPT

          A previous AI review of an earlier version of this PR is included below. Start your answer with a section \"Previous findings\" that lists each of its findings as ✅ addressed or ❌ still open, judged against the current diff. Then report only new issues under \"New findings\"."
          fi

          jq -n \
            --arg model "$MODEL" \
            --argjson minCodingScore "$MIN_CODING_SCORE" \
            --arg prompt "$PROMPT" \
            --arg title "$PR_TITLE" \
            --arg body "$PR_BODY" \
            --rawfile diff pr.diff \
            --rawfile previous previous.md \
            '{
              model: $model,
              # Only route to providers that neither train on nor retain prompts
              provider: {data_collection: "deny", zdr: true},
              # Return token counts and cost in the response
              usage: {include: true},
              messages: [
                {role: "system", content: "You are a senior code reviewer. Answer concisely in Markdown. Reference files and lines from the diff. If there are no issues for a question, say so in one line."},
                {role: "user", content: ($prompt + "\n\nPR title: " + $title + "\n\nPR description:\n" + $body
                  + (if $previous != "" then "\n\nPrevious review:\n" + $previous else "" end)
                  + "\n\nDiff:\n```diff\n" + $diff + "\n```")}
              ]
            }
            + if $model == "openrouter/pareto-code"
              then {plugins: [{id: "pareto-router", min_coding_score: $minCodingScore}]}
              else {} end' > request.json

          curl -sS --fail-with-body https://openrouter.ai/api/v1/chat/completions \
            -H "Authorization: Bearer $OPENROUTER_API_KEY" \
            -H "Content-Type: application/json" \
            -d @request.json > response.json

          REVIEW=$(jq -r '.choices[0].message.content // empty' response.json)
          [ -n "$REVIEW" ] || { echo "No review returned:"; cat response.json; exit 1; }
          # Routers resolve to a concrete model; show which one actually reviewed
          USED_MODEL=$(jq -r '.model // empty' response.json)

          # OpenRouter reports the cost in USD (credits)
          COST=$(jq -r '.usage | if .cost != null then "$\(.cost * 10000 | round / 10000) · \(.prompt_tokens) prompt + \(.completion_tokens) completion tokens" else "n/a" end' response.json 2>/dev/null || echo "n/a")

          printf '%s\n### 🤖 AI consistency review (`%s`)\n\n%s\n\n<sub>💰 Review cost: %s</sub>\n' \
            "$MARKER" "${USED_MODEL:-$MODEL}" "$REVIEW" "$COST" > comment.md

          # Post a new comment per review so the history and each run's cost stay visible
          gh pr comment "${{ github.event.pull_request.number }}" --body-file comment.md

          # Collapse earlier reviews as outdated; they stay readable but don't clutter the thread
          for NODE_ID in $(jq -r '.[].node_id' previous.json 2>/dev/null); do
            gh api graphql -f id="$NODE_ID" \
              -f query='mutation($id: ID!) { minimizeComment(input: {subjectId: $id, classifier: OUTDATED}) { clientMutationId } }' \
              > /dev/null || echo "::warning::Could not hide previous review comment $NODE_ID"
          done

      - name: Report skipped review
        if: steps.checkout.outcome == 'failure' || steps.diff.outcome == 'failure' || steps.review.outcome == 'failure'
        run: echo "::warning::AI review could not be completed, see the step logs above"
